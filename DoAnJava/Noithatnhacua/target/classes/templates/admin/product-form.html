<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background: #2c3e50; }
        .sidebar a { color: #bdc3c7; text-decoration: none; display: block; padding: 12px 20px; }
        .sidebar a:hover { background: #34495e; color: white; }
        .sidebar .active { background: #3498db; color: white; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <div class="p-3 text-white text-center border-bottom border-secondary">
                <h5 class="mb-0">⚙️ Admin Panel</h5>
            </div>
            <a href="/admin">📊 Dashboard</a>
            <a href="/admin/products" class="active">📦 Sản phẩm</a>
            <a href="/admin/categories">📂 Danh mục</a>
            <a href="/admin/orders">🛒 Đơn hàng</a>
            <a href="/admin/users">👥 Người dùng</a>
            <hr class="border-secondary">
            <a href="/">🏠 Về trang chủ</a>
        </div>

        <!-- Main content -->
        <div class="col-md-10 p-4">
            <h3 class="fw-bold mb-4" th:text="${product.id != null ? '✏️ Sửa Sản Phẩm' : '➕ Thêm Sản Phẩm Mới'}"></h3>

            <div class="card">
                <div class="card-body">
                    <form th:action="@{/admin/products/save}" method="post" th:object="${product}">
                        <input type="hidden" th:field="*{id}" />

                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label fw-bold">Tên sản phẩm *</label>
                                <input type="text" th:field="*{name}" class="form-control"
                                       placeholder="VD: Sofa cao cấp..." required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Danh mục *</label>
                                <select th:field="*{category.id}" class="form-select" required>
                                    <option value="">-- Chọn danh mục --</option>
                                    <option th:each="cat : ${categories}"
                                            th:value="${cat.id}"
                                            th:text="${cat.name}">Danh mục</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Giá (đ) *</label>
                                <input type="number" th:field="*{price}" class="form-control"
                                       placeholder="VD: 5000000" required min="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Tồn kho</label>
                                <input type="number" th:field="*{stock}" class="form-control"
                                       placeholder="VD: 10" min="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Ảnh URL</label>
                                <input type="text" th:field="*{imageUrl}" class="form-control"
                                       placeholder="https://...">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">Mô tả sản phẩm</label>
                                <textarea th:field="*{description}" class="form-control"
                                          rows="4" placeholder="Mô tả chi tiết sản phẩm..."></textarea>
                            </div>
                        </div>

                        <div class="mt-4 d-flex gap-3">
                            <button type="submit" class="btn btn-primary btn-lg">💾 Lưu sản phẩm</button>
                            <a href="/admin/products" class="btn btn-outline-secondary btn-lg">← Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
