<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background: #2c3e50; }
        .sidebar a { color: #bdc3c7; text-decoration: none; display: block; padding: 12px 20px; }
        .sidebar a:hover { background: #34495e; color: white; }
        .sidebar .active { background: #3498db; color: white; }
        .product-img { width: 60px; height: 60px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <div class="p-3 text-white text-center border-bottom border-secondary">
                <h5 class="mb-0">⚙️ Admin Panel</h5>
            </div>
            <a href="/admin">📊 Dashboard</a>
            <a href="/admin/products" class="active">📦 Sản phẩm</a>
            <a href="/admin/categories">📂 Danh mục</a>
            <a href="/admin/orders">🛒 Đơn hàng</a>
            <a href="/admin/users">👥 Người dùng</a>
            <hr class="border-secondary">
            <a href="/">🏠 Về trang chủ</a>
        </div>

        <!-- Main content -->
        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">📦 Quản Lý Sản Phẩm</h3>
                <a href="/admin/products/add" class="btn btn-primary">➕ Thêm sản phẩm</a>
            </div>

            <!-- Thanh tìm kiếm và lọc -->
            <div class="card mb-3">
                <div class="card-body">
                    <form th:action="@{/admin/products}" method="get" class="row g-2 align-items-end">
                        <div class="col-md-5">
                            <label class="form-label fw-bold small"> Tìm kiếm </label>
                            <input type="text" name="keyword" class="form-control"
                                   placeholder="Tên sản phẩm..." th:value="${keyword}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small"> Danh mục </label>
                            <select name="categoryId" class="form-select">
                                <option value="">-- Tất cả danh mục --</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}"
                                        th:selected="${selectedCategoryId == cat.id}">Danh mục</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-dark w-100">Lọc</button>
                            <a href="/admin/products" class="btn btn-outline-secondary w-100">Xóa lọc</a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Kết quả -->
            <p class="text-muted small" th:text="'Tìm thấy ' + ${#lists.size(products)} + ' sản phẩm'"></p>

            <div class="card">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Ảnh</th>
                            <th>Tên sản phẩm</th>
                            <th>Danh mục</th>
                            <th>Giá</th>
                            <th>Tồn kho</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p, i : ${products}">
                            <td th:text="${i.count}">1</td>
                            <td>
                                <img th:src="${p.imageUrl != null ? p.imageUrl : 'https://via.placeholder.com/60?text=No'}"
                                     class="product-img" th:alt="${p.name}">
                            </td>
                            <td th:text="${p.name}">Tên</td>
                            <td th:text="${p.category != null ? p.category.name : '-'}">Danh mục</td>
                            <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">Giá</td>
                            <td th:text="${p.stock}">0</td>
                            <td>
                                <span th:if="${p.stock > 0}" class="badge bg-success">
                                    Còn hàng (<span th:text="${p.stock}"></span>)
                                </span>
                                <span th:unless="${p.stock > 0}" class="badge bg-danger">Hết hàng</span>
                            </td>
                            <td>
                                <a th:href="@{/admin/products/edit/{id}(id=${p.id})}"
                                   class="btn btn-warning btn-sm me-1">Edit</a>
                                <a th:href="@{/admin/products/delete/{id}(id=${p.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Xóa sản phẩm này?')">Delete</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="8" class="text-center text-muted py-3">Không tìm thấy sản phẩm nào</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
