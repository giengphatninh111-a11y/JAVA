<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nội Thất Nhà Cửa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand { font-weight: bold; font-size: 1.5rem; }
        .hero {
            background-image: url('http://mediawinwin.vn/cosy/admin/upload/images/%E1%BA%A2nh%20N%E1%BB%99i%20Th%E1%BA%A5t/%E1%BA%A3nh%20n%E1%BB%99i%20th%E1%BA%A5t%2014.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            color: white;
            padding: 100px 0;
            text-align: center;
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
        }
        .hero-content {
            position: relative;
            z-index: 1;
        }
        .product-card { transition: transform 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .product-card img { height: 200px; object-fit: cover; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"> My Home</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">Trang chủ</a>
            <a class="nav-link" href="/products">Sản phẩm</a>

            <!-- Giỏ hàng -->
            <a class="nav-link position-relative" href="/cart">
                🛒Giỏ Hàng
                <span th:if="${cartCount != null and cartCount > 0}"
                      class="badge bg-danger rounded-pill position-absolute"
                      style="top:5px; font-size:0.65rem;"
                      th:text="${cartCount}"></span>
            </a>

            <a th:if="${loggedUser == null}" class="nav-link" href="/login">Đăng nhập</a>

            <th:block th:if="${loggedUser != null}">
                <a th:if="${loggedUser.role.name() == 'ADMIN'}"
                   class="nav-link text-warning fw-bold" href="/admin">⚙️ Trang Quản Lý</a>
                <span class="nav-link text-light">👤 <span th:text="${loggedUser.fullName}"></span></span>
                <a class="nav-link" href="/profile">📋 Đơn hàng</a>
                <a class="nav-link text-danger" href="/logout">Đăng xuất</a>
            </th:block>
        </div>
    </div>
</nav>

<!-- Hero Banner -->
<div class="hero">
    <div class="hero-overlay"></div>
    <div class="container hero-content">
        <h1 class="display-4 fw-bold">Nội Thất Cao Cấp</h1>
        <p class="lead">Không gian sống đẳng cấp - Chất lượng vượt trội</p>
        <a href="/products" class="btn btn-light btn-lg mt-3">Xem sản phẩm</a>
    </div>
</div>

<!-- Sản phẩm nổi bật -->
<div class="container my-5">
    <h2 class="text-center mb-4">Sản Phẩm Nổi Bật</h2>
    <div class="row g-4">
        <div th:each="product : ${products}" class="col-md-3">
            <div class="card product-card h-100">
                <img th:src="${product.imageUrl != null ? product.imageUrl : 'https://via.placeholder.com/300x200?text=No+Image'}"
                     class="card-img-top" th:alt="${product.name}">
                <div class="card-body">
                    <h6 class="card-title" th:text="${product.name}">Tên sản phẩm</h6>
                    <p class="text-danger fw-bold" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">Giá</p>
                    <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-outline-dark btn-sm w-100">Xem chi tiết</a>
                </div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(products)}" class="col-12 text-center text-muted">
            <p>Chưa có sản phẩm nào.</p>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-4 mt-5">
    <p class="mb-0">© 2026 Nội Thất Nhà Cửa. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
