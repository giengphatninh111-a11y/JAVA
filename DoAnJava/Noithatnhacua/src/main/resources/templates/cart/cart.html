<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - Nội Thất Nhà Cửa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">My Home</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">Trang chủ</a>
            <a class="nav-link" href="/products">Sản phẩm</a>

            <!-- Giỏ hàng -->
            <a class="nav-link position-relative active" href="/cart">
                🛒 Giỏ Hàng
                <span th:if="${cartCount != null and cartCount > 0}"
                      class="badge bg-danger rounded-pill position-absolute"
                      style="top:5px; font-size:0.65rem;"
                      th:text="${cartCount}"></span>
            </a>

            <a th:if="${loggedUser == null}" class="nav-link" href="/login">Đăng nhập</a>
            <th:block th:if="${loggedUser != null}">
                <a th:if="${loggedUser.role.name() == 'ADMIN'}"
                   class="nav-link text-warning fw-bold" href="/admin">⚙️ Trang Quản Lý</a>
                <span class="nav-link text-light">👤 <span th:text="${loggedUser.fullName}"></span></span>
                <a class="nav-link" href="/profile">📋 Đơn hàng</a>
                <a class="nav-link text-danger" href="/logout">Đăng xuất</a>
            </th:block>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h2 class="fw-bold mb-4">🛒 Giỏ Hàng</h2>

    <!-- Thông báo lỗi tồn kho -->
    <div th:if="${cartError != null}" class="alert alert-danger alert-dismissible fade show">
        ⚠️ <span th:text="${cartError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Giỏ hàng trống -->
    <div th:if="${#lists.isEmpty(cart)}" class="text-center py-5">
        <h4 class="text-muted">Giỏ hàng của bạn đang trống 😢</h4>
        <a href="/products" class="btn btn-dark mt-3">Tiếp tục mua sắm</a>
    </div>

    <!-- Giỏ hàng có sản phẩm -->
    <div th:unless="${#lists.isEmpty(cart)}">
        <div class="row">
            <!-- Danh sách sản phẩm -->
            <div class="col-md-8">
                <div class="card mb-3" th:each="item : ${cart}">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-2">
                                <img th:src="${item.imageUrl != null ? item.imageUrl : 'https://via.placeholder.com/80'}"
                                     class="img-fluid rounded" style="height:80px; object-fit:cover;">
                            </div>
                            <div class="col-md-4">
                                <h6 class="mb-0" th:text="${item.productName}">Tên</h6>
                                <small class="text-muted"
                                       th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">Giá</small>
                            </div>
                            <!-- Tăng/giảm số lượng -->
                            <div class="col-md-3 text-center">
                                <form th:action="@{/cart/update/{id}(id=${item.productId})}" method="post"
                                      class="d-flex align-items-center justify-content-center gap-1">
                                    <button type="submit" name="quantity"
                                            th:value="${item.quantity - 1}"
                                            class="btn btn-outline-secondary btn-sm"
                                            th:disabled="${item.quantity <= 1}">−</button>
                                    <span class="fw-bold mx-2" th:text="${item.quantity}">1</span>
                                    <button type="submit" name="quantity"
                                            th:value="${item.quantity + 1}"
                                            class="btn btn-outline-secondary btn-sm">+</button>
                                </form>
                            </div>
                            <div class="col-md-2 text-end">
                                <span class="text-danger fw-bold"
                                      th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' đ'">Tổng</span>
                            </div>
                            <div class="col-md-1 text-end">
                                <a th:href="@{/cart/remove/{id}(id=${item.productId})}"
                                   class="btn btn-sm btn-outline-danger">✕</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tổng tiền + Form đặt hàng -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3">📋 Thông tin đặt hàng</h5>
                        <div class="d-flex justify-content-between mb-3">
                            <span>Tổng tiền:</span>
                            <span class="text-danger fw-bold"
                                  th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                        </div>
                        <hr>
                        <form th:action="@{/cart/checkout}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Địa chỉ giao hàng *</label>
                                <textarea name="address" class="form-control" rows="3"
                                          placeholder="Nhập địa chỉ giao hàng..." required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Số điện thoại *</label>
                                <input type="text" name="phone" class="form-control"
                                       placeholder="VD: 0901234567" required>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 btn-lg">
                                ✅ Đặt hàng ngay
                            </button>
                        </form>
                        <a href="/products" class="btn btn-outline-secondary w-100 mt-2">
                            ← Tiếp tục mua sắm
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-4 mt-5">
    <p class="mb-0">© 2026 Nội Thất Nhà Cửa. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
