<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Danh Mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background: #2c3e50; }
        .sidebar a { color: #bdc3c7; text-decoration: none; display: block; padding: 12px 20px; }
        .sidebar a:hover { background: #34495e; color: white; }
        .sidebar .active { background: #3498db; color: white; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <div class="p-3 text-white text-center border-bottom border-secondary">
                <h5 class="mb-0">⚙️ Admin Panel</h5>
            </div>
            <a href="/admin">📊 Dashboard</a>
            <a href="/admin/products">📦 Sản phẩm</a>
            <a href="/admin/categories" class="active">📂 Danh mục</a>
            <a href="/admin/orders">🛒 Đơn hàng</a>
            <a href="/admin/users">👥 Người dùng</a>
            <hr class="border-secondary">
            <a href="/">🏠 Về trang chủ</a>
        </div>

        <!-- Main content -->
        <div class="col-md-10 p-4">
            <h3 class="fw-bold mb-4">📂 Quản Lý Danh Mục</h3>

            <!-- Form thêm danh mục -->
            <div class="card mb-4">
                <div class="card-header bg-success text-white fw-bold">
                    ➕ Thêm Danh Mục Mới
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/categories/save}" method="post">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Tên danh mục *</label>
                                <input type="text" name="name" class="form-control" placeholder="VD: Sofa, Bàn ghế..." required>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">Mô tả</label>
                                <input type="text" name="description" class="form-control" placeholder="Mô tả ngắn...">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Ảnh URL</label>
                                <input type="text" name="imageUrl" class="form-control" placeholder="https://...">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success mt-3">💾 Lưu danh mục</button>
                    </form>
                </div>
            </div>

            <!-- Danh sách danh mục -->
            <div class="card">
                <div class="card-header fw-bold">📋 Danh Sách Danh Mục</div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Tên danh mục</th>
                            <th>Mô tả</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="cat, i : ${categories}">
                            <td th:text="${i.count}">1</td>

                            <!-- Hiện text bình thường -->
                            <td th:id="'name-' + ${cat.id}" th:text="${cat.name}">Tên</td>
                            <td th:id="'desc-' + ${cat.id}" th:text="${cat.description}">Mô tả</td>

                            <!-- Form sửa - ẩn mặc định -->
                            <td colspan="2" th:id="'form-' + ${cat.id}" style="display:none;">
                                <form th:action="@{/admin/categories/save}" method="post" class="d-flex gap-2">
                                    <input type="hidden" th:name="id" th:value="${cat.id}">
                                    <input type="text" name="name" class="form-control form-control-sm"
                                           th:value="${cat.name}" required>
                                    <input type="text" name="description" class="form-control form-control-sm"
                                           th:value="${cat.description}">
                                    <button type="submit" class="btn btn-success btn-sm">💾</button>
                                    <button type="button" class="btn btn-secondary btn-sm"
                                            th:onclick="'toggleEdit(' + ${cat.id} + ')'">✕</button>
                                </form>
                            </td>

                            <td th:id="'actions-' + ${cat.id}">
                                <button class="btn btn-warning btn-sm me-1"
                                        th:onclick="'toggleEdit(' + ${cat.id} + ')'">Edit</button>
                                <a th:href="@{/admin/categories/delete/{id}(id=${cat.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Xóa danh mục này?')">Delete</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="4" class="text-center text-muted py-3">Chưa có danh mục nào</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleEdit(id) {
        const nameCell = document.getElementById('name-' + id);
        const descCell = document.getElementById('desc-' + id);
        const formCell = document.getElementById('form-' + id);
        const actionsCell = document.getElementById('actions-' + id);

        const isEditing = formCell.style.display !== 'none';
        nameCell.style.display = isEditing ? '' : 'none';
        descCell.style.display = isEditing ? '' : 'none';
        formCell.style.display = isEditing ? 'none' : '';
        actionsCell.style.display = isEditing ? '' : 'none';
    }
</script>
</body>
</html>
