<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Người Dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background: #2c3e50; }
        .sidebar a { color: #bdc3c7; text-decoration: none; display: block; padding: 12px 20px; }
        .sidebar a:hover { background: #34495e; color: white; }
        .sidebar .active { background: #3498db; color: white; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <div class="p-3 text-white text-center border-bottom border-secondary">
                <h5 class="mb-0">⚙️ Admin Panel</h5>
            </div>
            <a href="/admin">📊 Dashboard</a>
            <a href="/admin/products">📦 Sản phẩm</a>
            <a href="/admin/categories">📂 Danh mục</a>
            <a href="/admin/orders">🛒 Đơn hàng</a>
            <a href="/admin/users" class="active">👥 Người dùng</a>
            <hr class="border-secondary">
            <a href="/">🏠 Về trang chủ</a>
        </div>

        <!-- Main content -->
        <div class="col-md-10 p-4">
            <h3 class="fw-bold mb-4">👥 Quản Lý Người Dùng</h3>

            <!-- Tìm kiếm -->
            <div class="card mb-3">
                <div class="card-body">
                    <form th:action="@{/admin/users}" method="get" class="row g-2 align-items-end">
                        <div class="col-md-8">
                            <label class="form-label fw-bold small">🔍 Tìm kiếm</label>
                            <input type="text" name="keyword" class="form-control"
                                   placeholder="Tên, email, SĐT..." th:value="${keyword}">
                        </div>
                        <div class="col-md-4 d-flex gap-2">
                            <button type="submit" class="btn btn-dark w-100">Tìm</button>
                            <a href="/admin/users" class="btn btn-outline-secondary w-100">Xóa lọc</a>
                        </div>
                    </form>
                </div>
            </div>

            <p class="text-muted small" th:text="'Tìm thấy ' + ${#lists.size(users)} + ' người dùng'"></p>

            <div class="card">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Họ tên</th>
                            <th>Email</th>
                            <th>SĐT</th>
                            <th>Địa chỉ</th>
                            <th>Vai trò</th>
                            <th>Ngày tạo</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u, i : ${users}">
                            <td th:text="${i.count}">1</td>
                            <td th:text="${u.fullName}">Tên</td>
                            <td th:text="${u.email}">Email</td>
                            <td th:text="${u.phone}">SĐT</td>
                            <td th:text="${u.address}">Địa chỉ</td>
                            <td>
                                <span th:if="${u.role.name() == 'ADMIN'}" class="badge bg-danger">Admin</span>
                                <span th:unless="${u.role.name() == 'ADMIN'}" class="badge bg-secondary">User</span>
                            </td>
                            <td th:text="${#temporals.format(u.createdAt, 'dd/MM/yyyy')}">Ngày</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="7" class="text-center text-muted py-3">Không tìm thấy người dùng nào</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
